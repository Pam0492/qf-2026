<style>
/* Layout: stile nativo iOS. Titolo grande, liste "inset grouped", tab bar traslucida, fogli dal basso con maniglia */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --sunk:#E9E9EF; --ink:#000000; --muted:#6C6C70; --line:#C6C6C8;
  --accent:#1E7A62; --accent-ink:#FFFFFF; --save:#5856D6; --charge:#C26A00; --neg:#D70015;
  --bar:rgb(249 249 249 / .86); --press:#D1D1D6; --budget:#0A84FF;
  --f-display:-apple-system, "SF Pro Display", system-ui, sans-serif;
  --f-body:-apple-system, "SF Pro Text", system-ui, sans-serif;
  --f-num:-apple-system, "SF Pro Text", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --sunk:#2C2C2E; --ink:#FFFFFF; --muted:#AEAEB2; --line:#48484A;
  --accent:#3CC79E; --accent-ink:#00140E; --save:#7D7AFF; --charge:#FFA53A; --neg:#FF6961;
  --bar:rgb(22 22 24 / .86); --press:#3A3A3C; --budget:#409CFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --sunk:#2C2C2E; --ink:#FFFFFF; --muted:#AEAEB2; --line:#48484A;
  --accent:#3CC79E; --accent-ink:#00140E; --save:#7D7AFF; --charge:#FFA53A; --neg:#FF6961;
  --bar:rgb(22 22 24 / .86); --press:#3A3A3C; --budget:#409CFF; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:8px;border-bottom:.5px solid var(--line)}
.brand{font-weight:600;font-size:17px;flex:1;min-width:0}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mswitch{display:flex;align-items:center}
.mswitch button{border:0;background:none;width:44px;height:44px;border-radius:22px;cursor:pointer;font-size:26px;line-height:1;color:var(--accent)}
.mswitch button:active{background:var(--sunk)}
.mswitch span{min-width:112px;text-align:center;font-weight:600;font-size:15px;text-transform:capitalize}
.titlebar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:10px}
.largetitle{font-family:var(--f-display);font-weight:700;font-size:34px;letter-spacing:.01em;text-transform:capitalize;min-width:0}
.addbtn{flex:none;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px;min-height:40px;padding:0 16px;border-radius:20px;cursor:pointer;margin-bottom:4px}
.addbtn:active{opacity:.7}
.brand small{display:none}
.mswitch.off{visibility:hidden}

.banner{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--surface);font-size:15px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner b{color:var(--ink)}

section{margin-top:26px;display:flex;flex-direction:column;gap:7px}
.label{font-size:13px;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);padding-inline:16px}
.foot{font-size:13px;color:var(--muted);padding-inline:16px;margin:0}

.hero{padding-top:8px;gap:4px}
.hero .label{padding:0}
.hero .big{font-family:var(--f-display);font-weight:700;font-size:clamp(42px,13vw,56px);line-height:1.05;letter-spacing:-.01em}
.hero .big.neg{color:var(--neg)}
.hero p{margin:4px 0 0;color:var(--muted);font-size:15px}

.split{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk);margin-top:6px}
.split i{display:block;height:100%}
.bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar i.over{background:var(--neg)}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices button{border:0;background:var(--surface);min-height:40px;padding:0 14px;border-radius:20px;font-size:15px;font-weight:500;color:var(--ink);cursor:pointer}
.choices button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.field input.bigamt{font-size:34px;font-weight:600;min-height:48px;font-variant-numeric:tabular-nums}
.seg.three{grid-template-columns:repeat(3,1fr)}
.stat{display:flex;gap:12px;flex-wrap:wrap;align-items:baseline;color:var(--muted);font-size:15px}
.stat b{color:var(--ink);font-size:17px}
.daylabel{text-transform:none}
.chip.bud{color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend span::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}

.ledger{background:var(--surface);border-radius:12px;overflow:hidden}
.row{position:relative;display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 16px;min-height:44px;align-items:center}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}
.row .t{min-width:0;overflow-wrap:anywhere}
.row .sub{grid-column:1/-1;font-size:14px;color:var(--muted)}
.row.total{font-weight:600}
.row.total .sub{font-weight:400}
.row.item{align-items:start}
.amt small{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:1px}
.row.click{cursor:pointer;padding-right:34px}
.row.click::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;border-top:2px solid var(--press);border-right:2px solid var(--press);transform:translateY(-50%) rotate(45deg)}
.row.click:active{background:var(--sunk)}
.amt{text-align:right;white-space:nowrap}
.minus{color:var(--muted)}

.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:2px;white-space:nowrap;background:var(--sunk)}
.chip.save{color:var(--save)} .chip.charge{color:var(--charge)} .chip.off{color:var(--muted)}

.btn{border:0;background:var(--surface);border-radius:12px;min-height:50px;padding:0 18px;cursor:pointer;font-weight:600;font-size:17px;color:var(--accent)}
.btn:active{opacity:.6}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--neg)}
.btn.sm{min-height:44px;padding:0 14px;font-size:15px}
.btn.plain{background:none;padding:0 4px;min-height:44px}
.actions{display:flex;gap:10px;flex-direction:column}
.actions.inline{flex-direction:row;flex-wrap:wrap}
.del{border:0;background:none;width:44px;height:44px;margin:-11px -12px -11px 0;color:var(--neg);font-size:15px;cursor:pointer}

.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:15px}

.mcard .label{display:flex;justify-content:space-between;gap:8px}
.mcard.cur .ledger{box-shadow:0 0 0 2px var(--accent)}
.mcard{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 70px)}
.neg{color:var(--neg)}
.est-amt{font-style:italic;color:var(--muted)}
.cal{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--surface);border-radius:12px}
.cal table{border-collapse:collapse;font-size:13px;min-width:100%}
.cal th,.cal td{padding:9px 8px;border-top:.5px solid var(--line);text-align:right;white-space:nowrap}
.cal thead th{border-top:0;color:var(--muted);font-weight:600;text-transform:capitalize}
.cal th:first-child,.cal td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);max-width:120px;overflow:hidden;text-overflow:ellipsis;padding-left:14px}
.cal td.hit{color:var(--charge);font-weight:600}
.cal td.cur,.cal th.cur{background:var(--sunk)}
.cal tfoot td{font-weight:600}
.cal .dot{color:var(--line)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;min-height:50px;padding:6px 2px 4px;cursor:pointer;color:var(--muted);font-size:10px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="true"]{color:var(--accent)}

.sheet-bg{position:fixed;inset:0;z-index:20;background:rgb(0 0 0 / .4);display:flex;align-items:flex-end;justify-content:center}
/* Foglio dal basso: parte alta fissa (maniglia + titolo), parte sotto che scorre sempre */
.sheet{background:var(--bg);width:100%;max-width:560px;height:calc(100vh - 12px);height:calc(100dvh - env(safe-area-inset-top,0px) - 12px);border-radius:14px 14px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet-head{flex:none;padding:8px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));touch-action:none;cursor:grab;border-bottom:.5px solid var(--line)}
.sheet-body{flex:1 1 auto;min-height:0;display:block;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-body>*+*{margin-top:16px}
.sheet-body>[hidden]+*{margin-top:16px}
.grab{width:36px;height:5px;border-radius:3px;background:var(--press);margin:0 auto 6px}
.sheet header{display:flex;align-items:center;gap:10px}
.sheet header h2{flex:1;font-size:17px;font-weight:600;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet header .btn{min-width:72px}
.field input[type="month"]{display:block;text-align:left}
.field input::-webkit-date-and-time-value{text-align:left}
.group{background:var(--surface);border-radius:12px;overflow:hidden}
.field{position:relative;display:flex;flex-direction:column;gap:4px;padding:12px 16px}
.field+.field::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}
.field label{font-size:14px;color:var(--muted);font-weight:500}
.field .hint{font-size:14px;color:var(--muted);line-height:1.35}
.field input,.field select,.field textarea{width:100%;padding:4px 0;border:0;background:none;font-size:17px;outline:none;min-height:32px;-webkit-appearance:none;appearance:none}
.field select{background:none;padding-right:28px;color:var(--accent);font-weight:500}
.field:has(select)::after{content:"";position:absolute;right:20px;top:46px;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);pointer-events:none}
.field input::placeholder,.field textarea::placeholder{color:var(--muted);opacity:.7}
.field input[type="month"]{color:var(--accent);font-weight:500}
.field textarea{font-family:ui-monospace,"SF Mono",monospace;font-size:13px;min-height:140px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:none;min-height:32px;border-radius:7px;cursor:pointer;font-weight:500;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:600;box-shadow:0 3px 8px rgb(0 0 0 / .12)}
.preview{background:var(--surface);border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap;color:var(--muted);font-size:15px}
.preview b{font-size:22px;color:var(--ink)}
.confirm .btn{background:var(--sunk)}
.confirm{background:var(--surface);border-radius:12px;padding:14px 16px;font-size:15px;display:flex;flex-direction:column;gap:10px}
.toggle{flex-direction:row!important;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.toggle>span{display:flex;flex-direction:column;gap:3px;font-size:17px;color:var(--ink);min-width:0}
.toggle{min-height:64px}
.field input.switch{-webkit-appearance:none;appearance:none;width:51px;min-height:31px;height:31px;padding:0;border-radius:16px;background:var(--sunk);position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
.field input.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgb(0 0 0 / .25);transition:transform .2s}
.field input.switch:checked{background:var(--accent)}
.field input.switch:checked::after{transform:translateX(20px)}
.chip.est{color:var(--muted);font-style:italic}
.cal td.est{font-style:italic;color:var(--muted)}
.err{font-size:14px;color:var(--neg);padding-inline:16px}
.err:empty{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;font-weight:500;white-space:nowrap}
@media (hover:hover){.row.click:hover,.mswitch button:hover{background:var(--sunk)}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .28s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(100%)}}.sheet-bg{animation:fade .2s}@keyframes fade{from{background:transparent}}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">Il Mio Mese<small id="syncState">Salvato su questo iPhone, funziona offline</small></div>
    <div class="mswitch" id="mswitch" role="group" aria-label="Mese">
      <button id="prevM" aria-label="Mese precedente">‹</button>
      <span id="mLabel"></span>
      <button id="nextM" aria-label="Mese successivo">›</button>
    </div>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
</div>

  <button data-tab="mese"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M21 19H3"/></svg>Mese</button>
  <button data-tab="spese"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Spese</button>
  <button data-tab="voci"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Voci</button>

  <button data-tab="impostazioni"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2.5"/><path d="M3 10.5h18M7 6l9-3 1.2 3M15.5 15.5h2"/></svg>Stipendio</button>

<script>
/* ===== Mesi ===== */
const MESI=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const MBREVI=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const mIdx=m=>{const[y,mm]=m.split("-").map(Number);return y*12+mm-1};
const mStr=i=>`${Math.floor(i/12)}-${String(i%12+1).padStart(2,"0")}`;
const mAdd=(m,n)=>mStr(mIdx(m)+n);
const mNome=m=>`${MESI[mIdx(m)%12]} ${Math.floor(mIdx(m)/12)}`;
const today=new Date();const OGGI=mStr(today.getFullYear()*12+today.getMonth());

const VERSIONE="2.1 · 30 ottobre 2026";
const CADENZE={1:"Mensile",2:"Bimestrale",3:"Trimestrale",6:"Semestrale",12:"Annuale",24:"Biennale"};
const CATEGORIE=["Casa","Utenze","Assicurazioni","Trasporti","Abbonamenti","Salute","Tasse","Famiglia","Altro"];
const eur=new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"});
const EU=v=>{const n=Math.round((+v||0)*100)/100;let[i,d]=Math.abs(n).toFixed(2).split(".");i=i.replace(/\B(?=(\d{3})+(?!\d))/g,".");return(n<0?"−":"")+i+","+d+" €"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const parseNum=s=>{s=String(s).trim().replace(/\s|€/g,"");if(s.includes(",")){s=s.replace(/\./g,"").replace(",",".")}const n=parseFloat(s);return isFinite(n)?n:NaN};

/* ===== Modello =====
 state.salary: [{from:"YYYY-MM", amount}]
 state.moves:  [{id,date:"YYYY-MM-DD",amount,note,budgetId}]  spese reali registrate una per una
 state.items:  [{id,name,kind:"spesa"|"budget"|"risparmio",category,endedAt:null|"YYYY-MM",carry,rates,
                 versions:[{from, amount, cadence, anchor}]}]
 Ogni modifica crea una versione valida "dal mese X": i mesi precedenti restano invariati. */
function esempio(){
  const s=OGGI, y=s.slice(0,4);
  return {sample:true,salary:[{from:mAdd(s,-6),amount:2150}],items:[
    {id:uid(),name:"Affitto",kind:"spesa",category:"Casa",endedAt:null,versions:[{from:mAdd(s,-6),amount:750,cadence:1,anchor:mAdd(s,-6)}]},
    {id:uid(),name:"Luce e gas",kind:"spesa",category:"Utenze",endedAt:null,variable:true,coverage:"prima",bills:{[`${y}-01`]:182,[`${y}-03`]:158,[`${y}-05`]:104,[`${y}-07`]:92,[`${y}-09`]:118},versions:[{from:mAdd(s,-6),amount:140,cadence:2,anchor:`${y}-01`}]},
    {id:uid(),name:"Condominio",kind:"spesa",category:"Casa",endedAt:null,versions:[{from:mAdd(s,-6),amount:210,cadence:3,anchor:`${y}-03`}]},
    {id:uid(),name:"RC Auto",kind:"spesa",category:"Assicurazioni",endedAt:null,versions:[{from:mAdd(s,-6),amount:540,cadence:12,anchor:`${y}-04`}]},
    {id:uid(),name:"Bollo auto",kind:"spesa",category:"Tasse",endedAt:null,versions:[{from:mAdd(s,-6),amount:186,cadence:12,anchor:`${y}-02`}]},
    {id:uid(),name:"Palestra",kind:"spesa",category:"Salute",endedAt:null,versions:[{from:mAdd(s,-6),amount:240,cadence:6,anchor:`${y}-01`}]},
    {id:uid(),name:"Internet casa",kind:"spesa",category:"Utenze",endedAt:null,versions:[{from:mAdd(s,-6),amount:27.9,cadence:1,anchor:mAdd(s,-6)}]},
    {id:uid(),name:"PAC ETF azionario",kind:"risparmio",category:"Investimenti",endedAt:null,versions:[{from:mAdd(s,-6),amount:200,cadence:1,anchor:mAdd(s,-6)}]},

let state=null;
const norm=st=>{st.salary=st.salary||[];st.items=st.items||[];st.moves=st.moves||[];st.paid=st.paid||{};st.payDay=st.payDay||13;st.periodOn=!!st.periodOn;return st};
/* Periodo "da stipendio a stipendio": il periodo di un mese M va dal giorno in cui arriva lo stipendio di M
   al giorno prima dello stipendio di M+1. Se lo stipendio non è ancora registrato si usa il giorno abituale. */
const inNum=v=>(+v).toFixed(2).replace(".",",");
const pad2=n=>String(n).padStart(2,"0");
const isoToday=()=>{const d=new Date();return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`};
const arrival=m=>state.paid[m]?.date||`${m}-${pad2(Math.min(28,state.payDay||13))}`;
const periodOf=d=>{if(!state.periodOn)return d.slice(0,7);const m=d.slice(0,7);return d>=arrival(m)?m:mAdd(m,-1)};
const curPeriod=()=>periodOf(isoToday());
const shortDay=d=>`${+d.slice(8,10)} ${MBREVI[+d.slice(5,7)-1]}`;
function periodLabel(m){if(!state.periodOn)return "";const a=arrival(m),nx=mAdd(m,1),b=arrival(nx);
  const end=new Date(+b.slice(0,4),+b.slice(5,7)-1,+b.slice(8,10)-1),e=`${end.getFullYear()}-${pad2(end.getMonth()+1)}-${pad2(end.getDate())}`;
  return `Dal ${shortDay(a)}${state.paid[m]?"":" (previsto)"} al ${shortDay(e)}${state.paid[nx]?"":" (prossimo stipendio previsto il "+shortDay(b)+")"}`}

const salaryAt=m=>{if(state.paid&&state.paid[m])return state.paid[m].amount;let r=null;for(const s of state.salary){if(mIdx(s.from)<=mIdx(m)&&(!r||mIdx(s.from)>=mIdx(r.from)))r=s}return r?r.amount:0};
function versionAt(it,m){
  if(it.endedAt&&mIdx(m)>=mIdx(it.endedAt))return null;
  let r=null;for(const v of it.versions){if(mIdx(v.from)<=mIdx(m)&&(!r||mIdx(v.from)>=mIdx(r.from)))r=v}return r;
}
/* Quota mensile e addebito di una voce in un mese.
   - Spesa fissa: importo ÷ mesi della cadenza; addebito intero nei mesi della cadenza.
   - Risparmio/PAC: intero ogni mese, nessuna ripartizione.
   - Spesa variabile (bollette): ogni bolletta registrata si divide sui mesi che copre.
     Per i mesi non ancora coperti da una bolletta registrata si usa una stima:
     la bolletta dello stesso periodo dell'anno prima, altrimenti la media delle ultime 6, altrimenti la stima iniziale. */
function billEst(it,v,B){
  const b=it.bills||{};const ly=b[mStr(B-12)];if(ly!=null)return{amt:ly,how:"stessa bolletta dell'anno prima"};
  let ks=Object.keys(b).filter(x=>mIdx(x)<=B).sort((x,y)=>mIdx(y)-mIdx(x)).slice(0,6);
  if(!ks.length)ks=Object.keys(b).sort((x,y)=>mIdx(x)-mIdx(y)).slice(0,6);
  if(ks.length)return{amt:ks.reduce((a,x)=>a+b[x],0)/ks.length,how:ks.length===1?"ultima bolletta":`media delle ultime ${ks.length} bollette`};
  return{amt:v.amount,how:"stima iniziale"};
}
const covOff=it=>it.coverage==="incluso"?0:1;
function calcItem(it,v,m){
  if(it.kind==="risparmio")return{q:v.amount,c:v.amount};
  const cad=v.cadence,k=mIdx(m);
  if(!it.variable){const d=k-mIdx(v.anchor);return{q:v.amount/cad,c:((d%cad)+cad)%cad===0?v.amount:0}}
  const o=covOff(it),b=it.bills||{},keys=Object.keys(b).map(mIdx).sort((x,y)=>x-y);
  const A=keys.length?keys[keys.length-1]:mIdx(v.anchor);
  let q=null,qEst=false;
  for(const B of keys){if(B-o-cad+1<=k&&k<=B-o){q=b[mStr(B)]/cad;break}}
  if(q===null){qEst=true;let Bk=k+o;for(let i=0;i<cad;i++){if((((k+o+i)-A)%cad+cad)%cad===0){Bk=k+o+i;break}}q=billEst(it,v,Bk).amt/cad}
  let c=0,cEst=false;
  if(b[m]!=null)c=b[m];
  else if((!keys.length||k>keys[keys.length-1]||k<keys[0])&&((k-A)%cad+cad)%cad===0){c=billEst(it,v,k).amt;cEst=true}
  return{q,c,qEst,cEst};
}
const quota=(it,v,m=cur)=>calcItem(it,v,m).q;
const charged=(it,v,m)=>calcItem(it,v,m).c;
/* Budget: importo messo a disposizione ogni mese per spese variabili (extra, spesa, benzina…).
   Le spese registrate lo consumano. Se "accumula" è attivo, il non speso passa al mese dopo (salvadanaio).
   Nel libero conta il budget del mese, più l'eventuale sforamento oltre quanto disponibile. */
const movesOf=m=>state.moves.filter(x=>periodOf(x.date)===m);
function budgetMonth(it,m){
  const start=Math.min(...it.versions.map(v=>mIdx(v.from))),k=mIdx(m);let carry=0;
  for(let i=start;i<=k;i++){
    const mm=mStr(i),v=versionAt(it,mm),amt=v?v.amount:0;
    const spent=state.moves.filter(x=>x.budgetId===it.id&&periodOf(x.date)===mm).reduce((a,x)=>a+x.amount,0);
    const carryIn=it.carry?carry:0,avail=amt+carryIn;
    if(i===k)return{amt,carryIn,avail,spent,left:avail-spent,deduct:amt+Math.max(0,spent-avail)};
    carry=Math.max(0,avail-spent);
  }
  return{amt:0,carryIn:0,avail:0,spent:0,left:0,deduct:0};
}
function monthCalc(m){
  const rows=[],budgets=[];
  for(const it of state.items){const v=versionAt(it,m);if(!v)continue;
    if(it.kind==="budget"){budgets.push({it,v,...budgetMonth(it,m)});continue}
    const x=calcItem(it,v,m);rows.push({it,v,q:x.q,real:x.c,qEst:!!x.qEst,cEst:!!x.cEst})}
  const stip=salaryAt(m);
  const spese=rows.filter(r=>r.it.kind==="spesa"), ris=rows.filter(r=>r.it.kind==="risparmio");
  const qS=spese.reduce((a,r)=>a+r.q,0), qR=ris.reduce((a,r)=>a+r.q,0);
  const realS=spese.reduce((a,r)=>a+r.real,0);
  const mv=movesOf(m),bIds=new Set(budgets.map(b=>b.it.id));
  const fuoriList=mv.filter(x=>!bIds.has(x.budgetId)),fuori=fuoriList.reduce((a,x)=>a+x.amount,0);
  const speso=mv.reduce((a,x)=>a+x.amount,0);
  const qB=budgets.reduce((a,b)=>a+b.deduct,0)+fuori;
  return {m,stip,spese,ris,budgets,mv,fuori,speso,qS,qR,qB,realS,libero:stip-qS-qR-qB};
}

      if(x)Object.assign(x,rec);else state.moves.push({id:uid(),...rec});
      state.lastBudget=bud;cur=periodOf(d);close();commit(x?"Spesa aggiornata":"Spesa registrata")};
    if(x)$("mvDel").onclick=()=>{$("mvConf").innerHTML=`<div class="confirm"><span>Eliminare questa spesa di ${EU(x.amount)}?</span><div class="actions"><button class="btn danger" id="mvDel2">Elimina</button><button class="btn" id="mvNo">Annulla</button></div></div>`;
      $("mvDel2").onclick=()=>{state.moves=state.moves.filter(m=>m!==x);close();commit("Spesa eliminata")};$("mvNo").onclick=()=>$("mvConf").innerHTML="";$("mvConf").scrollIntoView({behavior:"smooth",block:"end"})};
    if(!x)$("mvAmt").focus();
  },"mvOk");
}

function nextCharge(it,v){for(let i=0;i<v.cadence;i++){const m=mAdd(cur,i);if(charged(it,v,m))return MBREVI[mIdx(m)%12]+" "+m.slice(0,4)}return "—"}

function vCal(){

      const a=parseNum($("iAmt").value),c=+$("iCad").value;
      {const B=mIdx(OGGI),o=$("iCov").value==="incluso"?0:1,ms=[...Array(c)].map((_,i)=>MESI[(B-o-c+1+i)%12]);
       $("covH").textContent=`Esempio: la bolletta pagata a ${MESI[B%12]} si divide su ${ms.length>1?ms.slice(0,-1).join(", ")+" e "+ms.at(-1):ms[0]}.`}
      if(vr&&it&&Object.keys(it.bills||{}).length){const x=calcItem(it,{...v,cadence:c,amount:a>0?a:v.amount},cur);$("pvLab").textContent=`Quota di ${MESI[mIdx(cur)%12]}${x.qEst?" (stimata)":" (da bolletta vera)"}`;$("pv").textContent=EU(x.q);return}
      if(vr&&a>0){$("pvLab").textContent="Quota usata finché non registri bollette vere";$("pv").textContent=EU(a/c);return}
      if(!(a>0)){$("pv").textContent="—";$("pvLab").textContent="Quota mensile";return}
      if(kind==="risparmio"){$("pvLab").textContent="Esce ogni mese, conteggiato nei risparmi";$("pv").textContent=EU(a)}
      else if(kind==="budget"){$("pvLab").textContent=$("iCarry").checked?"Ogni mese nel salvadanaio":"A disposizione ogni mese";$("pv").textContent=EU(a)}
      else{$("pvLab").textContent=c===1?"Quota mensile":`Quota mensile (${EU(a)} ÷ ${c} mesi)`;$("pv").textContent=EU(a/c)}
    };
    $("kS").onclick=()=>{kind="spesa";if($("iCat").value==="Investimenti")$("iCat").value="Casa";upd()};$("kB").onclick=()=>{kind="budget";if($("iCat").value==="Investimenti")$("iCat").value="Altro";upd()};$("kR").onclick=()=>{kind="risparmio";if($("iCat").value!=="Investimenti")$("iCat").value="Investimenti";upd()};
    ["iAmt","iCad","iCov","iVar","iRate","iAnc","iCarry"].forEach(i=>{$(i).oninput=upd;$(i).onchange=upd});upd();
    if(it&&$("iAddB")){$("iAddB").onclick=()=>openBill(it.id,cur);document.querySelectorAll("[data-bm]").forEach(e=>e.onclick=()=>openBill(it.id,e.dataset.bm))}
    $("iOk").onclick=()=>{
      const name=$("iName").value.trim(),a=parseNum($("iAmt").value),from=$("iFrom").value;
      const sp=kind==="spesa",cad=sp?+$("iCad").value:1,anchor=sp?($("iAnc").value||from):from;
      const nR=parseInt($("iRate").value,10),vr0=sp&&$("iVar").checked,rates=sp&&!vr0&&nR>0?nR:null;
      if($("iRate").value.trim()&&!rates&&sp&&!vr0){$("iErr").textContent="Il numero di rate deve essere un numero intero, ad esempio 20.";return}
      if(!name){$("iErr").textContent="Dai un nome alla voce.";return}
      if(!(a>0)){$("iErr").textContent="Inserisci un importo maggiore di zero, ad esempio 120,50.";return}
      if(!from){$("iErr").textContent="Scegli il mese da cui vale.";return}
      const ver={from,amount:a,cadence:cad,anchor};
      const vr=vr0,cov=$("iCov").value,carry=kind==="budget"&&$("iCarry").checked;
      let tgt=it;
      if(it){it.name=name;it.kind=kind;it.category=$("iCat").value;it.variable=vr;it.coverage=cov;it.carry=carry;if(vr&&!it.bills)it.bills={};it.versions=it.versions.filter(x=>x.from!==from);it.versions.push(ver);
        if(it.endedAt&&(it.rates||mIdx(it.endedAt)<=mIdx(from)))it.endedAt=null}
      else{tgt={id:uid(),name,kind,category:$("iCat").value,endedAt:null,variable:vr,coverage:cov,carry,bills:{},versions:[ver]};state.items.push(tgt)}
      tgt.rates=rates;if(rates)tgt.endedAt=mAdd(anchor,rates*cad);
      close();commit(it?"Modifiche salvate":"Voce aggiunta");
    };
    if(it){
      if($("iSus"))$("iSus").onclick=()=>{it.endedAt=cur;it.rates=null;close();commit(`Sospesa da ${mNome(cur)}`)};
      if($("iRe"))$("iRe").onclick=()=>{it.endedAt=null;close();commit("Voce riattivata")};
      $("iDel").onclick=()=>{$("iConf").innerHTML=`<div class="confirm"><span>Eliminare <b>${esc(it.name)}</b> anche da tutti i mesi passati? Per smettere di contarla da ora in poi usa Sospendi.</span><div class="actions"><button class="btn danger" id="iDel2">Elimina definitivamente</button><button class="btn" id="iNo">Annulla</button></div></div>`;
        $("iDel2").onclick=()=>{state.items=state.items.filter(x=>x!==it);close();commit("Voce eliminata")};$("iNo").onclick=()=>$("iConf").innerHTML="";$("iConf").scrollIntoView({behavior:"smooth",block:"end"})};
    }
  },"iOk");
}

function openBill(id,m){
  const it=state.items.find(i=>i.id===id);if(!it)return;
  const v=versionAt(it,m)||it.versions[it.versions.length-1];
  if(!it.bills)it.bills={};const had=it.bills[m]!=null;
  const est=billEst(it,v,mIdx(m));
  sheet(it.name,`
   <div class="group"><div class="field"><label for="bAmt">Importo della bolletta (€)</label><input id="bAmt" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="${est.amt.toFixed(2).replace(".",",")}" value="${had?inNum(it.bills[m]):""}"></div>
    <div class="field"><label for="bM">Mese in cui la paghi</label><input id="bM" type="month" value="${m}"></div></div>
   <p class="foot">${had?"":`Finché non la inserisci l'app usa ${EU(est.amt)} (${est.how}).`}</p>
   <div class="preview"><span id="bPv"></span><b id="bQ"></b></div>
   <div id="bErr" class="err"></div>
   <div class="actions"><button class="btn primary" id="bOk">${had?"Salva bolletta":"Registra bolletta"}</button>${had?`<button class="btn danger" id="bDel">Rimuovi questa bolletta</button>`:""}</div>`,close=>{
    const $=i=>document.getElementById(i);
    const upd=()=>{const a=parseNum($("bAmt").value),mm=$("bM").value;if(!mm)return;const B=mIdx(mm),o=covOff(it),c=v.cadence;
      const ms=[...Array(c)].map((_,i)=>MESI[(B-o-c+1+i)%12]);
      $("bPv").textContent="Si divide su "+(ms.length>1?ms.slice(0,-1).join(", ")+" e "+ms.at(-1):ms[0]);
      $("bQ").textContent=a>0?EU(a/c)+" al mese":""};
    $("bAmt").oninput=upd;$("bM").onchange=upd;$("bM").oninput=upd;upd();
    $("bOk").onclick=()=>{const a=parseNum($("bAmt").value),mm=$("bM").value;
      if(!(a>0)){$("bErr").textContent="Inserisci l'importo della bolletta, ad esempio 167 o 167,40.";return}
      if(!mm){$("bErr").textContent="Scegli il mese in cui la paghi.";return}
      if(had&&mm!==m)delete it.bills[m];it.bills[mm]=a;close();commit(`Bolletta di ${MESI[mIdx(mm)%12]} registrata`)};
    if(had)$("bDel").onclick=()=>{delete it.bills[m];close();commit("Bolletta rimossa")};
  },"bOk");
}

async function exportData(){
  const json=JSON.stringify({...state,sample:false},null,1);
  try{const f=new File([json],`il-mio-mese-${OGGI}.json`,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Backup Il Mio Mese"});return}}catch(e){if(e&&e.name==="AbortError")return}
  sheet("Esporta dati",`<div class="group"><div class="field"><label for="exT">Copia questo testo e incollalo in Note o in un messaggio a te stessa</label><textarea id="exT" readonly>${esc(json)}</textarea></div></div><div class="actions"><button class="btn primary" id="cp">Copia</button></div>`,()=>{
    document.getElementById("cp").onclick=async()=>{const t=document.getElementById("exT");try{await navigator.clipboard.writeText(t.value);toast("Copiato")}catch(e){t.select()}}});
}
function openImport(){
  sheet("Importa dati",`<div class="group"><div class="field"><label for="imF">Scegli il file di backup da File</label><input id="imF" type="file" accept=".json,application/json"></div>
   <div class="field"><label for="imT">Oppure incolla il testo esportato</label><textarea id="imT"></textarea><span class="hint">I dati attuali verranno sostituiti.</span></div></div>
   <div class="actions"><button class="btn primary" id="imOk">Importa e sostituisci</button></div><div id="imErr" class="err"></div>`,close=>{
   document.getElementById("imF").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>document.getElementById("imT").value=r.result;r.readAsText(f)};
   document.getElementById("imOk").onclick=()=>{try{const d=JSON.parse(document.getElementById("imT").value);if(!Array.isArray(d.items)||!Array.isArray(d.salary))throw 0;state=norm({...d,sample:false});close();commit("Dati importati")}catch(e){document.getElementById("imErr").textContent="Il testo non è un backup valido di Il Mio Mese."}};});
}

/* ===== Avvio ===== */
document.getElementById("prevM").onclick=()=>{cur=mAdd(cur,-1);render()};
document.getElementById("nextM").onclick=()=>{cur=mAdd(cur,1);render()};
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo(0,0)});
let sx0=null,sy0=null;
view.addEventListener("touchstart",e=>{if(e.target.closest(".cal")){sx0=null;return}sx0=e.touches[0].clientX;sy0=e.touches[0].clientY},{passive:true});
view.addEventListener("touchend",e=>{if(sx0===null)return;const dx=e.changedTouches[0].clientX-sx0,dy=e.changedTouches[0].clientY-sy0;sx0=null;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6&&(tab==="mese"||tab==="voci"||tab==="spese")){cur=mAdd(cur,dx<0?1:-1);render()}},{passive:true});
state=norm(lsGet()||esempio());cur=autoCur=curPeriod();
document.addEventListener("visibilitychange",()=>{if(document.hidden)return;const p=curPeriod();if(p!==autoCur){if(cur===autoCur)cur=p;autoCur=p;render()}});
render();
try{navigator.storage?.persist?.()}catch(e){}
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
</script>
